# Massive Decks at https://<your site>/CAH/
#
# Installed to /etc/apache2/conf-available/massivedecks.conf and enabled with
# `a2enconf massivedecks` by install.sh. It applies to every site on the
# server; to limit it to one, put these lines inside that site's
# <VirtualHost *:443> instead and disable the conf.
#
# Needs: a2enmod proxy proxy_http headers

Define MD_DIST /opt/massivedecks/repo/client/dist
Define MD_SOCKET /run/massivedecks/server.sock

RedirectMatch 301 ^/CAH$ /CAH/

# The game server: its API and its websocket, over a local socket (nothing
# listens on a public port). /CAH/api/... is passed on as /api/...
ProxyPass        /CAH/api/ unix:${MD_SOCKET}|http://localhost/api/ upgrade=websocket
ProxyPassReverse /CAH/api/ http://localhost/api/
<Location /CAH/api/>
    RequestHeader set X-Forwarded-Proto "https" "expr=%{HTTPS} == 'on'"
    LimitRequestBody 65536
</Location>

# The client: static files. Any address that isn't a file (/CAH/games/ABCD,
# shared invite links) gets the app, which reads the address itself.
Alias /CAH/cast ${MD_DIST}/cast.html
Alias /CAH/ ${MD_DIST}/

<Directory ${MD_DIST}>
    Require all granted
    Options -Indexes
    AllowOverride None
    FallbackResource /CAH/index.html

    # the page names the current scripts: always check it for a new version
    <Files "index.html">
        Header set Cache-Control "no-cache"
    </Files>
</Directory>

# scripts, styles and fonts have a hash in their name: cache them for good
<LocationMatch "^/CAH/assets/">
    Header set Cache-Control "public, max-age=31536000, immutable"
</LocationMatch>
